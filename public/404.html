<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — MugenSoft</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c12;color:#e2e8f0;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,204,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,204,.03)1px,transparent 1px);background-size:60px 60px;pointer-events:none}
    .orb{position:fixed;border-radius:50%;pointer-events:none}
    .orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(0,229,204,.1) 0%,transparent 70%);top:-100px;right:-100px;animation:float 8s ease-in-out infinite}
    .orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(79,70,229,.12) 0%,transparent 70%);bottom:-80px;left:-80px;animation:float2 11s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(15px)}}
    .container{text-align:center;position:relative;z-index:1;padding:32px}
    .code{font-family:'Space Mono',monospace;font-size:clamp(80px,15vw,160px);font-weight:700;line-height:1;background:linear-gradient(135deg,#00e5cc,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
    .msg{font-family:'Space Mono',monospace;font-size:14px;color:#00e5cc;letter-spacing:3px;margin-bottom:16px}
    h1{font-size:clamp(24px,4vw,36px);font-weight:700;margin-bottom:12px}
    p{color:#64748b;font-size:16px;margin-bottom:40px;max-width:400px;margin-left:auto;margin-right:auto;line-height:1.7}
    .btn{display:inline-block;border:1px solid #00e5cc;color:#00e5cc;padding:12px 32px;border-radius:6px;font-family:'Space Mono',monospace;font-size:13px;text-decoration:none;transition:all .2s;margin:8px}
    .btn:hover{background:rgba(0,229,204,.1);box-shadow:0 0 20px rgba(0,229,204,.3)}
    .btn2{border-color:rgba(255,255,255,.15);color:#94a3b8}
    .btn2:hover{background:rgba(255,255,255,.05);box-shadow:none}
    .glitch{animation:glitch 3s ease-in-out infinite}
    @keyframes glitch{0%,90%,100%{transform:translate(0)}92%{transform:translate(-2px,1px)}94%{transform:translate(2px,-1px)}96%{transform:translate(-1px,2px)}98%{transform:translate(1px,-1px)}}
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="container">
    <div class="code glitch">404</div>
    <p class="msg">// Page not found</p>
    <h1>You've gone off the map</h1>
    <p>This page doesn't exist — but MugenSoft does. Head back and let's build something real.</p>
    <div>
      <a href="/" class="btn">← Back Home</a>
      <a href="/#contact" class="btn btn2">Contact Me</a>
    </div>
  </div>
</body>
</html>
